.sw input:checked+span{display:block}
.sw label:has(input:checked){border-color:var(--fg)}
.switch{display:inline-flex;align-items:center;gap:8px}
.heart{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.heart[aria-pressed="true"]{color:#D6455D;border-color:#D6455D;background:var(--bad-bg)}
.heart[aria-pressed="true"] .ic{fill:currentColor}

/* ---- first interface: premium vault gate ---- */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes inword{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes twk{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.9;transform:scale(1.2)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(63,212,160,.5)}100%{box-shadow:0 0 0 16px rgba(63,212,160,0)}}
@keyframes dropin{from{transform:translateY(-100%)}to{transform:none}}
@keyframes flowin{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes seg{from{width:0}to{width:100%}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
html.noscroll,html.noscroll body{overflow:hidden}
#intro{position:fixed;inset:0;z-index:300;color:#E6F2EE;overflow:hidden;font-family:var(--fb);background:transparent}

function bindSlide(){
  var tr=$('#inslide'),h=$('#inhandle');if(!tr||!h)return;
  var fill=tr.querySelector('.in-fill'),x0=0,cx=0,drag=false,moved=false,max=0;
  var pos=function(x){h.style.transform='translateX('+x+'px)';fill.style.width=(x+54)+'px'};
  h.addEventListener('pointerdown',function(e){drag=true;moved=false;cx=0;x0=e.clientX;max=tr.clientWidth-58;try{h.setPointerCapture(e.pointerId)}catch(_){}tr.classList.add('drag')});
  h.addEventListener('pointermove',function(e){if(!drag)return;cx=Math.max(0,Math.min(max,e.clientX-x0));if(cx>4)moved=true;pos(cx)});
  var end=function(){if(!drag)return;drag=false;tr.classList.remove('drag');
    if(cx>max*0.8){pos(max);introOpen(false)}
    else{h.style.transform='';fill.style.width='';if(!moved){h.classList.remove('nudge');void h.offsetWidth;h.classList.add('nudge');setTimeout(function(){h.classList.remove('nudge')},800)}}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();pos(tr.clientWidth-58);introOpen(false)}});
}

  setTimeout(finish,1550);
}

window.__SQL="-- SAFELYTRUST Revenue & Billing — PostgreSQL / Supabase migration (PARTS 1-3)\n-- Status: DESIGN FOR LIVE BACKEND. Review with your DBA/security team first.\n-- All money = NUMERIC(14,2) in BDT. All calculation must run server-side (RPC / Edge Function), never in the browser.\nbegin;\ncreate extension if not exists pgcrypto;\n\n-- ---------- enums ----------\ncreate type billing_mode as enum ('normal_free','free_usage','pro_max');\ncreate type charge_mode as enum ('none','percentage','fixed');\ncreate type collection_status as enum ('pending','held','collected','refunded','waived','reversed');\ncreate type revenue_source as enum ('subscription','visitor_fee','order_fee','customer_platform_fee','customer_cancel_fee','merchant_cancel_fee','api','custom_domain','premium_store','store_setup','additional_service','partnership','adjustment','reversal');\ncreate type admin_role as enum ('super_admin','finance_admin','support_admin','auditor');\n\n-- ---------- identity / RBAC ----------\ncreate table admin_users(id uuid primary key default gen_random_uuid(), auth_user_id uuid unique not null, role admin_role not null, active boolean not null default true, created_at timestamptz not null default now());\ncreate table role_permissions(role admin_role not null, permission text not null, primary key(role,permission));\ninsert into role_permissions values\n ('super_admin','revenue.config'),('super_admin','finance.ops'),('super_admin','cases.decide'),('super_admin','reports.view'),('super_admin','audit.view'),('super_admin','roles.manage'),\n ('finance_admin','finance.ops'),('finance_admin','reports.view'),\n ('support_admin','cases.view'),('support_admin','cases.decide'),\n ('auditor','reports.view'),('auditor','cases.view'),('auditor','audit.view');\ncreate or replace function has_perm(p text) returns boolean language sql stable security definer as $$\n  select exists(select 1 from admin_users u join role_permissions rp on rp.role=u.role where u.auth_user_id=auth.uid() and u.active and rp.permission=p) $$;\n\n-- ---------- revenue configuration (versioned, immutable history) ----------\ncreate table revenue_modules(id text primary key, name text not null, enabled boolean not null default false, requires_legal boolean not null default false, optional boolean not null default true);\ncreate table revenue_module_settings(\n  id uuid primary key default gen_random_uuid(), module_id text not null references revenue_modules(id),\n  version int not null, charge_mode charge_mode not null default 'none',\n  rate numeric(7,4) check (rate between 0 and 100), fixed_amount numeric(14,2) check (fixed_amount>=0),\n  basis text, min_fee numeric(14,2) not null default 0 check (min_fee>=0), max_fee numeric(14,2) not null default 0 check (max_fee>=0),\n  applicable_modes billing_mode[] not null default '{}', effective_from date, reason text not null,\n  created_by uuid not null references admin_users(id), created_at timestamptz not null default now(),\n  unique(module_id,version), check (max_fee=0 or min_fee<=max_fee));\ncreate index on revenue_module_settings(module_id,effective_from);\n\n-- ---------- plans & merchants ----------\ncreate table subscription_plans(id uuid primary key default gen_random_uuid(), code text unique not null, name text not null, monthly_price numeric(14,2) check(monthly_price>=0), yearly_price numeric(14,2) check(yearly_price>=0),\n  trial_days int not null default 0, discount_pct numeric(5,2) not null default 0, grace_days int not null default 0, visitor_limit int, order_limit int, storage_mb int, staff_limit int, api_access boolean not null default false, custom_domain boolean not null default false,\n  visitor_fee_rule text not null default 'waived' check (visitor_fee_rule in ('included','waived','reduced','additional')), visitor_fee_value numeric(14,2) not null default 0,\n  order_fee_rule text not null default 'waived' check (order_fee_rule in ('included','waived','reduced','additional')), order_fee_value numeric(14,2) not null default 0, active boolean not null default true);\ncreate table merchant_billing_profiles(merchant_id uuid primary key references merchants(id), mode billing_mode not null default 'normal_free', usage_agreement_version int, usage_accepted_at timestamptz, usage_accepted_by uuid,\n  check ((mode='free_usage') = (usage_accepted_at is not null)));\ncreate table merchant_subscriptions(id uuid primary key default gen_random_uuid(), merchant_id uuid not null references merchants(id), plan_id uuid not null references subscription_plans(id), period text not null check(period in ('monthly','yearly')),\n  status text not null check (status in ('trial','active','grace','expired','cancelled')), starts_at timestamptz not null, ends_at timestamptz not null, auto_renew boolean not null default true,\n  unique(merchant_id,plan_id,starts_at));\n\n-- ---------- usage & idempotency ----------\ncreate table usage_events(id uuid primary key default gen_random_uuid(), merchant_id uuid not null references merchants(id), kind text not null check(kind in ('visitor','completed_order')),\n  visitor_key text, order_id uuid references orders(id), day date, is_bot boolean not null default false, created_at timestamptz not null default now(),\n  constraint one_visitor_per_day unique nulls not distinct (merchant_id,kind,visitor_key,day),\n  constraint one_event_per_order unique nulls not distinct (merchant_id,kind,order_id));\n\n-- ---------- ledgers (append-only, separate accounting families) ----------\ncreate table billing_ledger(  -- Merchant Service Billing\n  id uuid primary key default gen_random_uuid(), txn_id text unique not null, merchant_id uuid not null references merchants(id), source revenue_source not null,\n  amount numeric(14,2) not null, currency char(3) not null default 'BDT', status text not null, reference_id text not null, policy_version int not null default 0,\n  description text, snapshot jsonb, reverses uuid references billing_ledger(id), invoice_id uuid, created_at timestamptz not null default now(),\n  unique(source,reference_id));\ncreate index on billing_ledger(merchant_id,created_at);\ncreate table customer_platform_fee_records(id uuid primary key default gen_random_uuid(), order_id uuid unique not null references orders(id), customer_id uuid not null, amount numeric(14,2) not null check(amount>=0), status collection_status not null, policy_snapshot jsonb not null, created_at timestamptz not null default now());\ncreate table cancellation_policies(id uuid primary key default gen_random_uuid(), party text not null check(party in ('customer','merchant')), version int not null, config jsonb not null, effective_from date, created_by uuid not null references admin_users(id), created_at timestamptz not null default now(), unique(party,version));\ncreate table cancellation_cases(id uuid primary key default gen_random_uuid(), order_id uuid unique not null references orders(id), initiated_by text not null check(initiated_by in ('customer','merchant')), reason text not null, action text not null check(action in ('customer','merchant','review','none')), status text not null, potential_fee numeric(14,2), created_at timestamptz not null default now());\ncreate table cancellation_evidence(id uuid primary key default gen_random_uuid(), case_id uuid not null references cancellation_cases(id), submitted_by text not null, body text, file_path text, created_at timestamptz not null default now());\ncreate table cancellation_decisions(id uuid primary key default gen_random_uuid(), case_id uuid not null references cancellation_cases(id), admin_id uuid not null references admin_users(id), decision text not null, reason text not null check(length(trim(reason))>0), evidence text, policy_version int, created_at timestamptz not null default now());\ncreate table cancellation_fee_records(id uuid primary key default gen_random_uuid(), case_id uuid unique not null references cancellation_cases(id), payer text not null check(payer in ('customer','merchant')), amount numeric(14,2) not null check(amount>0), collected numeric(14,2) not null default 0, status collection_status not null, policy_snapshot jsonb not null, created_at timestamptz not null default now()); -- unique(case_id) = never charge both parties\ncreate table refund_records(id uuid primary key default gen_random_uuid(), order_id uuid, fee_record_id uuid, kind text not null, amount numeric(14,2) not null check(amount>0), provider_reference text, reason text, approved_by uuid references admin_users(id), created_at timestamptz not null default now());\ncreate table financial_adjustments(id uuid primary key default gen_random_uuid(), target_id uuid not null, kind text not null check(kind in ('refund','adjust','waive')), amount numeric(14,2), reason text not null, status text not null default 'requested' check(status in ('requested','approved','rejected')), requested_by uuid not null references admin_users(id), decided_by uuid references admin_users(id), created_at timestamptz not null default now(), check(decided_by is null or decided_by<>requested_by));\ncreate table additional_service_sales(id uuid primary key default gen_random_uuid(), merchant_id uuid not null references merchants(id), module_id text not null references revenue_modules(id), service_name text not null, amount numeric(14,2) not null, third_party_cost numeric(14,2) not null default 0, status collection_status not null, policy_snapshot jsonb not null, created_at timestamptz not null default now());\ncreate table partnership_revenue(id uuid primary key default gen_random_uuid(), partner text not null, contract_ref text not null, statement_ref text not null, amount numeric(14,2) not null check(amount>0), received_at timestamptz, unique(contract_ref,statement_ref));\ncreate table invoices(id uuid primary key default gen_random_uuid(), number text unique not null, merchant_id uuid not null references merchants(id), total numeric(14,2) not null, status text not null, lines uuid[] not null, created_at timestamptz not null default now());\ncreate table payment_webhooks(id uuid primary key default gen_random_uuid(), provider text not null, event_id text not null, signature_valid boolean not null, payload jsonb not null, processed boolean not null default false, received_at timestamptz not null default now(), unique(provider,event_id)); -- replay/duplicate prevention\n\n-- ---------- audit log (append-only, hash chained) ----------\ncreate table admin_audit_logs(id bigint generated always as identity primary key, actor_id uuid, action text not null, previous_value jsonb, new_value jsonb, reason text, record_id text, prev_hash text, hash text, created_at timestamptz not null default now());\ncreate or replace function audit_chain() returns trigger language plpgsql as $$\ndeclare ph text; begin select hash into ph from admin_audit_logs order by id desc limit 1;\n  new.prev_hash:=coalesce(ph,'0'); new.hash:=encode(digest(new.prev_hash||new.action||coalesce(new.actor_id::text,'')||coalesce(new.new_value::text,'')||new.created_at::text,'sha256'),'hex'); return new; end $$;\ncreate trigger t_audit_chain before insert on admin_audit_logs for each row execute function audit_chain();\n\n-- ---------- immutability: no update/delete on financial history ----------\ncreate or replace function forbid_mutation() returns trigger language plpgsql as $$ begin raise exception 'financial history is immutable; use adjustment/reversal rows'; end $$;\ndo $$ declare t text; begin foreach t in array array['billing_ledger','admin_audit_logs','cancellation_decisions','refund_records','revenue_module_settings','cancellation_policies','usage_events'] loop\n  execute format('create trigger t_immut_%1$s before update or delete on %1$s for each row execute function forbid_mutation()',t); end loop; end $$;\n-- (status transitions on fee/collection tables must go through SECURITY DEFINER functions that also write ledger + audit rows)\n\n-- ---------- reporting view (unified, read-only) ----------\ncreate view revenue_ledger as\n  select txn_id as id, source::text as source, merchant_id::text as party, amount as final_amount, currency, status, policy_version, created_at from billing_ledger where source<>'reversal'\n  union all select id::text,'customer_platform_fee',customer_id::text,amount,'BDT',status::text,(policy_snapshot->>'ver')::int,created_at from customer_platform_fee_records\n  union all select id::text,'cancellation_fee_'||payer,case_id::text,amount,'BDT',status::text,(policy_snapshot->>'ver')::int,created_at from cancellation_fee_records\n  union all select id::text,'service_'||module_id,merchant_id::text,amount,'BDT',status::text,(policy_snapshot->>'ver')::int,created_at from additional_service_sales\n  union all select id::text,'partnership',partner,amount,'BDT',case when received_at is null then 'pending' else 'collected' end,1,coalesce(received_at,now()) from partnership_revenue;\n\n-- ---------- Row Level Security ----------\ndo $$ declare t text; begin foreach t in array array['revenue_modules','revenue_module_settings','subscription_plans','merchant_billing_profiles','merchant_subscriptions','usage_events','billing_ledger','customer_platform_fee_records','cancellation_policies','cancellation_cases','cancellation_evidence','cancellation_decisions','cancellation_fee_records','refund_records','financial_adjustments','additional_service_sales','partnership_revenue','invoices','payment_webhooks','admin_audit_logs','admin_users','role_permissions'] loop\n  execute format('alter table %I enable row level security',t); end loop; end $$;\n-- reads\ncreate policy rep_read on billing_ledger for select using (has_perm('reports.view') or merchant_id=current_merchant_id());   -- merchant: own rows only\ncreate policy inv_read on invoices for select using (has_perm('reports.view') or merchant_id=current_merchant_id());\ncreate policy sub_read on merchant_subscriptions for select using (has_perm('reports.view') or merchant_id=current_merchant_id());\ncreate policy prof_read on merchant_billing_profiles for select using (has_perm('reports.view') or merchant_id=current_merchant_id());\ncreate policy usage_read on usage_events for select using (has_perm('reports.view') or merchant_id=current_merchant_id());\ncreate policy svc_read on additional_service_sales for select using (has_perm('reports.view') or merchant_id=current_merchant_id());\ncreate policy cfee_read on cancellation_fee_records for select using (has_perm('reports.view') or has_perm('cases.view'));\ncreate policy case_read on cancellation_cases for select using (has_perm('cases.view') or has_perm('reports.view'));\ncreate policy audit_read on admin_audit_logs for select using (has_perm('audit.view'));\ncreate policy cfg_read on revenue_module_settings for select using (has_perm('reports.view'));\ncreate policy mods_read on revenue_modules for select using (true);\n-- writes: ONLY through SECURITY DEFINER functions (calculate fees, validate, write ledger+audit in one transaction). No direct client writes.\ncreate policy cfg_write on revenue_module_settings for insert with check (has_perm('revenue.config'));\ncreate policy dec_write on cancellation_decisions for insert with check (has_perm('cases.decide'));\ncreate policy adj_write on financial_adjustments for insert with check (has_perm('finance.ops'));\ncreate policy roles_write on role_permissions for all using (has_perm('roles.manage')) with check (has_perm('roles.manage'));\n-- webhooks/payments: service role only (no policy => denied for clients)\n\n-- ---------- seed: initial module status (spec section 10) ----------\ninsert into revenue_modules(id,name,enabled,optional,requires_legal) values\n ('normal_free','Normal FREE',true,false,false),('free_usage','FREE + Usage-Based (opt-in)',true,false,false),('pro_max','PRO / MAX',true,false,false),\n ('visitor_fee','Visitor Fee',true,false,false),('order_fee','Completed Order Fee',true,false,false),\n ('customer_cancel_policy','Customer Cancellation Policy',true,false,false),('merchant_cancel_policy','Merchant Cancellation Policy',true,false,false),\n ('customer_platform_fee','Customer Platform Fee',false,true,false),('api','API Subscription Revenue',false,true,false),('custom_domain','Custom Domain Revenue',false,true,false),\n ('premium_store','Premium Store Customization',false,true,false),('store_setup','Store Setup & Migration',false,true,false),('additional_service','Additional Paid Services',false,true,false),('partnership','Courier / Payment Partnership Revenue',false,true,true);\ncommit;\n";
